<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Collaborative To-Do Task Spinner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      plugins: [tailwindcss.forms],
    };
  </script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@3.8.0/dist/full.css" rel="stylesheet" type="text/css" />
</head>
<body class="bg-gradient-to-r from-gray-100 to-blue-100 font-sans text-gray-800 min-h-screen flex flex-col items-center py-10">

<div class="card w-full max-w-2xl bg-white shadow-md p-6 mb-6">
  <h1 class="text-2xl font-bold text-center mb-4">🧠 Life Decision Spinner – To-Do List</h1>
  <div class="flex flex-col sm:flex-row items-center justify-center gap-3">
    <input type="text" id="taskInput" placeholder="Enter your task" class="input input-bordered w-full max-w-xs" />
    <select id="categorySelect" class="select select-bordered w-full max-w-xs">
      <option value="1">Important & Urgent</option>
      <option value="2">Important but Not Urgent</option>
      <option value="3">Not Important but Urgent</option>
      <option value="4">Not Important & Not Urgent</option>
    </select>
    <button onclick="addTask()" class="btn btn-success">Add Task</button>
  </div>
</div>

<div id="taskSections">
  <div class="card w-full max-w-2xl bg-white shadow-md p-4 mb-4">
    <h2 class="text-lg font-semibold mb-2">1. Important & Urgent</h2>
    <ul id="cat1" class="flex flex-wrap gap-2"></ul>
  </div>
  <div class="card w-full max-w-2xl bg-white shadow-md p-4 mb-4">
    <h2 class="text-lg font-semibold mb-2">2. Important but Not Urgent</h2>
    <ul id="cat2" class="flex flex-wrap gap-2"></ul>
  </div>
  <div class="card w-full max-w-2xl bg-white shadow-md p-4 mb-4">
    <h2 class="text-lg font-semibold mb-2">3. Not Important but Urgent</h2>
    <ul id="cat3" class="flex flex-wrap gap-2"></ul>
  </div>
  <div class="card w-full max-w-2xl bg-white shadow-md p-4 mb-4">
    <h2 class="text-lg font-semibold mb-2">4. Not Important & Not Urgent</h2>
    <ul id="cat4" class="flex flex-wrap gap-2"></ul>
  </div>
</div>

<script>
  const categories = {
    1: [],
    2: [],
    3: [],
    4: []
  };

  const savedData = localStorage.getItem('todoCategories');
  if (savedData) {
    const parsed = JSON.parse(savedData);
    for (let i = 1; i <= 4; i++) {
      categories[i] = parsed[i] || [];
    }
    updateTasks();
  }

  function addTask() {
    const taskInput = document.getElementById('taskInput');
    const category = document.getElementById('categorySelect').value;
    const taskText = taskInput.value.trim();
    if (!taskText) return;
    categories[category].push(taskText);
    updateTasks();
    taskInput.value = '';
    localStorage.setItem('todoCategories', JSON.stringify(categories));
  }

  function deleteTask(category, index) {
    categories[category].splice(index, 1);
    updateTasks();
    localStorage.setItem('todoCategories', JSON.stringify(categories));
  }

  function updateTasks() {
    for (let i = 1; i <= 4; i++) {
      const list = document.getElementById('cat' + i);
      list.innerHTML = '';
      categories[i].forEach((task, idx) => {
        const li = document.createElement('li');
        li.className = 'badge badge-info p-4 text-lg';
        li.textContent = task + " ";
        const del = document.createElement('button');
        del.textContent = '❌';
        del.className = 'ml-2 text-red-600 hover:text-red-800';
        del.onclick = () => deleteTask(i, idx);
        li.appendChild(del);
        list.appendChild(li);
      });
    }
  }
</script>

</body>
</html>
