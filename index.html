<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Collaborative To-Do Task Spinner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .wheel div {
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 1.25rem;
    }
  </style>
</head>
<body class="bg-gradient-to-r from-gray-100 to-blue-100 text-center font-sans p-6 text-gray-800">

<h1>🧠 Life Decision Spinner – To-Do List</h1>

<input type="text" id="taskInput" placeholder="Enter your task" class="border border-gray-300 rounded px-4 py-2 w-64 focus:outline-none focus:ring-2 focus:ring-blue-400">
<select id="categorySelect" class="border border-gray-300 rounded px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400">
  <option value="1">Important & Urgent</option>
  <option value="2">Important but Not Urgent</option>
  <option value="3">Not Important but Urgent</option>
  <option value="4">Not Important & Not Urgent</option>
</select>
<button onclick="addTask()" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600 transition">
  Add Task
</button>

<div id="taskSections">
  <div class="category bg-white p-4 mt-6 rounded shadow">
    <h2 class="text-lg font-semibold mb-2">1. Important & Urgent</h2>
    <ul id="cat1" class="task-list list-none p-0"></ul>
  </div>
  <div class="category bg-white p-4 mt-6 rounded shadow">
    <h2 class="text-lg font-semibold mb-2">2. Important but Not Urgent</h2>
    <ul id="cat2" class="task-list list-none p-0"></ul>
  </div>
  <div class="category bg-white p-4 mt-6 rounded shadow">
    <h2 class="text-lg font-semibold mb-2">3. Not Important but Urgent</h2>
    <ul id="cat3" class="task-list list-none p-0"></ul>
  </div>
  <div class="category bg-white p-4 mt-6 rounded shadow">
    <h2 class="text-lg font-semibold mb-2">4. Not Important & Not Urgent</h2>
    <ul id="cat4" class="task-list list-none p-0"></ul>
  </div>
</div>

<script>
  const categories = {
    1: [],
    2: [],
    3: [],
    4: []
  };

  const savedData = localStorage.getItem('todoCategories');
  if (savedData) {
    const parsed = JSON.parse(savedData);
    for (let i = 1; i <= 4; i++) {
      categories[i] = parsed[i] || [];
    }
    updateTasks();
  }

  function addTask() {
    const taskInput = document.getElementById('taskInput');
    const category = document.getElementById('categorySelect').value;
    const taskText = taskInput.value.trim();
    if (!taskText) return;
    categories[category].push(taskText);
    updateTasks();
    taskInput.value = '';
    localStorage.setItem('todoCategories', JSON.stringify(categories));
  }

  function deleteTask(category, index) {
    categories[category].splice(index, 1);
    updateTasks();
    localStorage.setItem('todoCategories', JSON.stringify(categories));
  }

  function updateTasks() {
    for (let i = 1; i <= 4; i++) {
      const list = document.getElementById('cat' + i);
      list.innerHTML = '';
      categories[i].forEach((task, idx) => {
        const li = document.createElement('li');
        li.className = 'task bg-blue-100 inline-block m-2 px-3 py-2 rounded';
        li.textContent = task + " ";
        const del = document.createElement('button');
        del.textContent = '❌';
        del.className = 'ml-2 text-red-600 hover:text-red-800';
        del.onclick = () => deleteTask(i, idx);
        li.appendChild(del);
        list.appendChild(li);
      });
    }
  }
</script>

</body>
</html>
