<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Life Decision Spinner</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 2rem;
      background: #f0f0f0;
    }

    .wheel-container {
      position: relative;
      width: 300px;
      height: 300px;
      margin: 2rem auto;
    }

    .wheel {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 10px solid #444;
      background: conic-gradient(
        #f44336 0% 14%,
        #e91e63 14% 28%,
        #9c27b0 28% 42%,
        #3f51b5 42% 56%,
        #03a9f4 56% 70%,
        #4caf50 70% 84%,
        #ff9800 84% 100%
      );
      transition: transform 4s ease-out;
    }

    .arrow {
      position: absolute;
      top: -20px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 15px solid transparent;
      border-right: 15px solid transparent;
      border-bottom: 20px solid black;
    }

    button {
      padding: 1rem 2rem;
      font-size: 1.2rem;
      background-color: #2196f3;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 1rem;
    }

    .result {
      font-size: 1.5rem;
      margin-top: 2rem;
    }
  </style>
</head>
<body>
  <h1>🎯 Life Decision Spinner</h1>
  <div class="wheel-container">
    <div class="arrow"></div>
    <div class="wheel" id="wheel"></div>
  </div>
  <button onclick="spin()">Spin the Wheel</button>
  <div class="result" id="result"></div>

  <script>
    const decisions = [
      "Text them back 😬",
      "Don't do it 😌",
      "Quit your job 😱",
      "Order pizza 🍕",
      "Take a nap 😴",
      "Go to the gym 💪",
      "Watch Netflix 📺"
    ];

    let spinning = false;

    function spin() {
      if (spinning) return;
      spinning = true;

      const wheel = document.getElementById("wheel");
      const result = document.getElementById("result");

      const randomDeg = Math.floor(Math.random() * 360 + 1080); // Multiple spins
      wheel.style.transform = `rotate(${randomDeg}deg)`;

      setTimeout(() => {
        const finalDeg = randomDeg % 360;
        const segment = Math.floor(finalDeg / (360 / decisions.length));
        const selected = decisions[decisions.length - 1 - segment]; // Reverse order for clockwise
        result.textContent = "💡 Decision: " + selected;
        spinning = false;
      }, 4000);
    }
  </script>
</body>
</html>
